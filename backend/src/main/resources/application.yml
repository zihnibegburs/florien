spring:
  application:
    name: florien-backend
  config:
    import: optional:classpath:application-local.yml

  datasource:
    url: jdbc:postgresql://localhost:5432/florien
    username: florien
    password: florien_secret
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6380

  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}

florien:
  jwt:
    secret: florien-dev-secret-key-change-in-production-min-256-bits-long!!
    expiration-ms: 86400000
  google:
    client-id: ${GOOGLE_CLIENT_ID:444356161269-9ukhho3o8jbtum1ht8ea9v6nungmoau3.apps.googleusercontent.com}
  groq:
    api-key: ${GROQ_API_KEY:}
    base-url: https://api.groq.com/openai/v1
    model: openai/gpt-oss-120b
    timeout-seconds: 60

logging:
  level:
    com.florien: DEBUG
