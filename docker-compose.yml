services:
  postgres:
    image: postgres:16-alpine
    container_name: florien-postgres
    environment:
      POSTGRES_DB: florien
      POSTGRES_USER: florien
      POSTGRES_PASSWORD: florien_secret
    ports:
      - "5432:5432"
    volumes:
      - florien_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U florien -d florien"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: florien-redis
    ports:
      - "6380:6379"
    volumes:
      - florien_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  florien_pg_data:
  florien_redis_data:
