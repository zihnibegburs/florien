# Render Blueprint — Florien full stack
# Dashboard: New → Blueprint → bu repo'yu seç
services:
  - type: web
    name: florien-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: florien-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: florien-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: florien-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: florien-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: florien-db
          property: password
      - key: FLORIEN_JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false

  - type: web
    name: florien-web
    runtime: static
    buildCommand: bash mobile/scripts/render-build.sh
    staticPublishPath: mobile/build/web
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: API_HOST
        fromService:
          type: web
          name: florien-api
          property: host

databases:
  - name: florien-db
    databaseName: florien
    user: florien
    plan: free
